name: acoudiet
description: >-
  AcouDiet (声膳) — on-device acoustic diet recognition and health scoring.
  Two Android flavours: the `offline` flavour requests no INTERNET permission
  (verifiable with `aapt dump badging`); the `agent` flavour adds an opt-in cloud
  agent that is OFF by default and requires the user's own API key. Audio never
  leaves the device in either flavour.
publish_to: "none"
# v1.2 REMOVES the on-device advice model (Qwen3.5-0.8B) and its whole wiring, at the user's
# request: "我不要qwen这种解释模型参与了，把软件回退到最初 ... 把qwen端侧相关代码删干净".
# What is gone: the 532 MB GGUF asset, `libacoudiet_llm.so`, the C shim, the advice polish
# layer, the AI weekly-review card and self-check item 15. What is KEPT: the v1.3 acoustic
# model (ADR-32) and the UI rebuilds of ADR-24/25/30 -- the rollback targets the LLM layer, not
# those. Rationale and the exact removal list: docs/01_<ADR log>.md ADR-34.
#
# The version is NOT lowered back to 1.0.0 even though the feature set returns there: Android
# refuses a downgrade install (INSTALL_FAILED_VERSION_DOWNGRADE), so versionCode must only grow.
#
# 1.2.1+4 (ADR-35): the packaged inference runtime changed from `org.tensorflow:tensorflow-lite`
# to `com.google.ai.edge.litert` so the APK can be mapped on 16 KB-page devices. Same features,
# different native library -- which is exactly the kind of difference a versionCode should record.
#
# 1.2.2+5 (ADR-38/ADR-39): the UI rounds. No model, permission or scoring change -- the same
# acoustic model, the same `{RECORD_AUDIO}`-only manifest -- but a new versionCode, because an
# APK whose interface was rebuilt must not be installable over the one it replaces without the
# user being able to tell them apart (ADR-24's lesson: two releases, same size, different bytes).
# 1.3.0+6 (ADR-44): the product becomes a phone-side diet Agent on top of the offline core.
# What changed for a versionCode to be required: TWO product flavours now exist (`agent` with the
# INTERNET permission and a fifth tab, `offline` byte-for-byte the old posture), a new page and a
# new platform channel were added, and the artifact names carry the flavour. Two APKs that differ
# in their PERMISSION SET must never be told apart only by their filename.
#
# The build-time flavour reaches Dart through `--dart-define=ACOUDIET_FLAVOUR=<flavour>`, which
# `tool/build_release.ps1` passes automatically (see app/lib/core/flavour.dart).
version: 1.3.4+10

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

# Dependencies are deliberately minimal. The frozen plan (FF-23) names sqflite / Riverpod /
# fl_chart / tflite_flutter; this build ships dependency-free equivalents behind the same frozen
# contracts (API-03 repositories, API-04 domain services) instead. NOTE: that is now a *design
# choice*, not an offline constraint — an earlier "no network" finding turned out to be a Windows
# schannel failure in the probe tooling (PowerShell/curl), not a dead link. See
# records/reports/c04_dependency_deviation.md sections 1 and 1.1.
dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  uuid: ^3.0.7
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7

flutter:
  uses-material-design: true
  assets:
    - assets/feature_config.json
    - assets/foods.json
    - assets/demo_dataset.json
    # The whole models/ directory is bundled, not just the card: the model is a drop-in
    # artifact (see assets/models/README.md), so a newly installed .tflite must be picked up
    # without editing this file.
    - assets/models/
    - assets/demo/
